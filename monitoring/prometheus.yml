global:
  scrape_interval: 2s # Scrape fast for real-time data [cite: 43]

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'load_balancer'
    scrape_interval: 1s
    static_configs:
      - targets: ['tw-lb:8080']

  - job_name: 'cadvisor'
    scrape_interval: 5s
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'distributed_nodes'
    metrics_path: /metrics
    static_configs:
      - targets: 
        - 'node-1:8000'
        - 'node-2:8000'
        - 'node-3:8000'
        - 'node-4:8000'
        - 'node-5:8000'
        - 'node-6:8000'
        - 'node-7:8000'
        - 'node-8:8000'
        - 'node-9:8000'
        - 'node-10:8000'
        - 'node-11:8000'
        - 'node-12:8000'
        - 'node-13:8000'
        - 'node-14:8000'
        - 'node-15:8000'
